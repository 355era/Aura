<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Aura by 355ERA — spectral grain shifter</title>
  <desc id="desc">Scalable, vector-drawn dark charcoal, orchid, and mint interface with a live lily visualizer and seven FFT and granular controls.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171925"/><stop offset="1" stop-color="#090a10"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#25283b"/><stop offset="1" stop-color="#1d2030"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#82eadc"/><stop offset="1" stop-color="#a978ff"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#a978ff" stop-opacity=".28"/><stop offset="1" stop-color="#a978ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#42455e"/><stop offset="1" stop-color="#191b27"/></linearGradient>
    <pattern id="seeds" width="58" height="49" patternUnits="userSpaceOnUse"><circle cx="10" cy="12" r="1" fill="#70d7bb" opacity=".16"/><circle cx="41" cy="34" r="1" fill="#70d7bb" opacity=".11"/></pattern>
    <path id="petal" d="M0-8 C13-23 15-43 0-62 C-15-43-13-23 0-8Z"/>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .cream { fill:#f2f1ff } .muted { fill:#9b9fb2 } .mint { fill:#82eadc }
      .caps { letter-spacing:1.8px }
    </style>
  </defs>
  <rect width="1040" height="620" fill="#090a10"/>
  <rect x="8" y="8" width="1024" height="604" rx="23" fill="url(#shell)" stroke="#343849"/>
  <rect x="24" y="72" width="992" height="480" fill="url(#seeds)" opacity=".6"/>
  <g fill="none" stroke="#70d7bb" stroke-linecap="round" stroke-linejoin="round"><path d="M31 43 C34 35 37 31 42 26 C42 34 39 40 31 43Z"/><path d="M37 35 C36 29 30 27 26 28 C27 34 31 38 37 35Z"/></g>
  <text x="53" y="44" class="cream" font-size="13" font-weight="700" letter-spacing="1.2">355ERA</text>
  <text x="145" y="43" class="muted caps" font-size="9">BOTANICAL SOUND OBJECTS</text>
  <circle cx="830" cy="36" r="3" fill="#ff997f"/><text x="1000" y="40" class="muted caps" font-size="9" text-anchor="end">FFT + GRAIN ENGINE</text>
  <path d="M28 62 H1012" stroke="#343849"/>
  <text x="39" y="132" class="cream" font-size="46" font-weight="700" letter-spacing="2">AURA</text>
  <text x="42" y="163" class="mint" font-size="10" font-weight="700" letter-spacing="2">SPECTRAL GRAIN SHIFTER</text>
  <text x="42" y="188" class="muted" font-size="11">Refract a sound into new growth.</text>
  <path d="M310 90 V548" stroke="#343849"/>
  <text x="330" y="111" class="mint caps" font-size="9" font-weight="700">SPECTRAL GARDEN</text>
  <text x="330" y="130" class="muted" font-size="9.5">Shift, bloom, then scatter the grains.</text>
  <text x="330" y="153" class="muted caps" font-size="8" font-weight="700">PRESET</text>
  <rect x="390" y="135" width="270" height="28" rx="5" fill="#1d2030" stroke="#343849"/>
  <text x="402" y="153" class="cream" font-size="10">Choose preset</text>
  <path d="M644 146l5 5 5-5" fill="none" stroke="#82eadc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="670" y="135" width="112" height="28" rx="5" fill="#82eadc"/>
  <text x="726" y="153" fill="#090a10" font-size="8" font-weight="700" text-anchor="middle" letter-spacing=".7">SAVE PRESET</text>
  <g fill="url(#card)" stroke="#343849" stroke-opacity=".8">
    <rect x="322" y="170" width="150" height="151" rx="13"/><rect x="482" y="170" width="150" height="151" rx="13"/>
    <rect x="642" y="170" width="150" height="151" rx="13"/><rect x="802" y="170" width="150" height="151" rx="13"/>
    <rect x="402" y="333" width="150" height="151" rx="13"/><rect x="562" y="333" width="150" height="151" rx="13"/>
    <rect x="722" y="333" width="150" height="151" rx="13"/>
  </g>
