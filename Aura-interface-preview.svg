  <rect x="786" y="135" width="100" height="28" rx="5" fill="#202325" stroke="#3c4143"/><text x="836" y="153" class="white" font-size="9" font-weight="600" text-anchor="middle">Load bank</text>
  <rect x="894" y="135" width="100" height="28" rx="5" fill="#202325" stroke="#3c4143"/><text x="944" y="153" class="white" font-size="9" font-weight="600" text-anchor="middle">Save bank</text>

