    <path d="M691 267A34 34 0 1 1 741 231"/><path d="M851 267A34 34 0 1 1 899 230"/>
    <path d="M371 430A34 34 0 1 1 421 430"/><path d="M531 430A34 34 0 1 1 581 392"/>
    <path d="M691 430A34 34 0 1 1 741 393"/><path d="M851 430A34 34 0 1 1 901 394"/>
