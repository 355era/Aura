  <circle cx="166" cy="316" r="94" fill="none" stroke="#343849"/>
  <circle cx="166" cy="316" r="76" fill="none" stroke="#70d7bb" stroke-opacity=".55"/>
  <g transform="translate(166 316)" stroke="#70d7bb" stroke-width="1" stroke-opacity=".72">
    <use href="#petal" fill="#a978ff" fill-opacity=".72"/><use href="#petal" fill="#a978ff" fill-opacity=".72" transform="rotate(60)"/><use href="#petal" fill="#a978ff" fill-opacity=".72" transform="rotate(120)"/>
    <use href="#petal" fill="#a978ff" fill-opacity=".72" transform="rotate(180)"/><use href="#petal" fill="#a978ff" fill-opacity=".72" transform="rotate(240)"/><use href="#petal" fill="#a978ff" fill-opacity=".72" transform="rotate(300)"/>
    <use href="#petal" fill="#efb9f6" transform="scale(.73) rotate(30)"/><use href="#petal" fill="#efb9f6" transform="scale(.73) rotate(90)"/><use href="#petal" fill="#efb9f6" transform="scale(.73) rotate(150)"/>
    <use href="#petal" fill="#efb9f6" transform="scale(.73) rotate(210)"/><use href="#petal" fill="#efb9f6" transform="scale(.73) rotate(270)"/><use href="#petal" fill="#efb9f6" transform="scale(.73) rotate(330)"/>
  </g>
