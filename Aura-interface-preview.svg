    <g transform="translate(717 244)"><circle r="34" fill="url(#dial)" stroke="#343849"/><path d="M-24 24 A34 34 0 1 1 24 24" fill="none" stroke="#343849" stroke-width="4"/><path d="M-24 24 A34 34 0 0 1 9-33" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round"/><path d="M0 0L8-19" stroke="#f2f1ff" stroke-width="2"/><circle r="3" fill="#ff997f"/></g>
    <g transform="translate(877 244)"><circle r="34" fill="url(#dial)" stroke="#343849"/><path d="M-24 24 A34 34 0 1 1 24 24" fill="none" stroke="#343849" stroke-width="4"/><path d="M-24 24 A34 34 0 0 1 20-27" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round"/><path d="M0 0L19-12" stroke="#f2f1ff" stroke-width="2"/><circle r="3" fill="#ff997f"/></g>
    <g transform="translate(477 407)"><circle r="34" fill="url(#dial)" stroke="#343849"/><path d="M-24 24 A34 34 0 1 1 24 24" fill="none" stroke="#343849" stroke-width="4"/><path d="M-24 24 A34 34 0 0 1 20-27" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round"/><path d="M0 0L19-12" stroke="#f2f1ff" stroke-width="2"/><circle r="3" fill="#ff997f"/></g>
    <g transform="translate(637 407)"><circle r="34" fill="url(#dial)" stroke="#343849"/><path d="M-24 24 A34 34 0 1 1 24 24" fill="none" stroke="#343849" stroke-width="4"/><path d="M-24 24 A34 34 0 0 1 16-30" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round"/><path d="M0 0L15-15" stroke="#f2f1ff" stroke-width="2"/><circle r="3" fill="#ff997f"/></g>
    <g transform="translate(797 407)"><circle r="34" fill="url(#dial)" stroke="#343849"/><path d="M-24 24 A34 34 0 1 1 24 24" fill="none" stroke="#343849" stroke-width="4"/><path d="M-24 24 A34 34 0 0 1 12-32" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round"/><path d="M0 0L12-17" stroke="#f2f1ff" stroke-width="2"/><circle r="3" fill="#ff997f"/></g>
