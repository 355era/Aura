  <g text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.3">
    <text x="397" y="192" class="cream">SHIFT</text><text x="557" y="192" class="cream">MIX</text><text x="717" y="192" class="cream">BLOOM</text><text x="877" y="192" class="cream">GRAIN</text>
    <text x="477" y="355" class="cream">SIZE</text><text x="637" y="355" class="cream">DENSITY</text><text x="797" y="355" class="cream">FEEDBACK</text>
  </g>
