<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Aura by 355ERA — soft botanical plugin interface</title>
  <desc id="desc">Soft sage and orchid VST3 interface with a sound-reactive lily visualizer and three fixed, stepped rotary controls.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf9f2"/>
      <stop offset="1" stop-color="#e9efe7"/>
    </linearGradient>
    <radialGradient id="flowerHalo">
      <stop offset="0" stop-color="#d8c4df" stop-opacity=".68"/>
      <stop offset="1" stop-color="#d8c4df" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dialArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b9d84"/>
      <stop offset="1" stop-color="#abc7ac"/>
    </linearGradient>
    <pattern id="seeds" width="58" height="49" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="12" r="1" fill="#78947c" opacity=".11"/>
      <circle cx="41" cy="34" r="1" fill="#78947c" opacity=".08"/>
    </pattern>
    <path id="outerPetal" d="M0-8 C13-23 15-43 0-62 C-15-43-13-23 0-8Z"/>
    <path id="innerPetal" d="M0-7 C10-20 11-34 0-46 C-11-34-10-20 0-7Z"/>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .caps { letter-spacing: 2px; }
      .muted { fill: #758276; }
      .leaf { fill: #78947c; }
      .deep { fill: #3d5944; }
    </style>
  </defs>

  <rect width="920" height="520" fill="#e9efe7"/>
  <rect x="8" y="8" width="904" height="504" rx="23" fill="url(#panel)" stroke="#cbd8c9" stroke-width="1.2"/>
  <rect x="28" y="78" width="864" height="360" fill="url(#seeds)"/>

  <!-- Creator and header -->
  <g fill="none" stroke="#78947c" stroke-linecap="round" stroke-linejoin="round">
    <path d="M31 43 C34 35 37 31 42 26 C42 34 39 40 31 43Z" stroke-width="1.5"/>
    <path d="M37 35 C36 29 30 27 26 28 C27 34 31 38 37 35Z" stroke-width="1.3"/>
  </g>
  <text x="53" y="44" class="deep" font-size="13" font-weight="700" letter-spacing="1.2">355ERA</text>
  <text x="145" y="43" class="muted caps" font-size="9">BOTANICAL SOUND OBJECTS</text>
  <circle cx="752" cy="36" r="3" fill="#d5aa70"/>
  <text x="888" y="40" class="muted caps" font-size="9" text-anchor="end">FFT FIELD / 2048</text>
  <path d="M28 62 H892" stroke="#cbd8c9"/>

  <!-- Title -->
  <text x="39" y="132" class="deep" font-size="46" font-weight="700" letter-spacing="2">AURA</text>
  <text x="42" y="163" fill="#6f9884" font-size="10" font-weight="700" letter-spacing="2">FFT SPECTRAL SHIFTER</text>
  <text x="42" y="188" class="muted" font-size="11">Refract a sound into new growth.</text>
  <path d="M315 90 V426" stroke="#cbd8c9" stroke-width="1"/>

  <!-- Lily visualizer: petal size and ring activity respond to input level -->
  <circle cx="166" cy="316" r="103" fill="url(#flowerHalo)"/>
  <circle cx="166" cy="316" r="94" fill="none" stroke="#cbd8c9" stroke-width="1"/>
  <circle cx="166" cy="316" r="77" fill="none" stroke="#78947c" stroke-opacity=".38"/>
  <g stroke-linecap="round" stroke="#78947c" stroke-opacity=".54">
    <path d="M166 230 V221"/><path d="M188 233 L191 225"/><path d="M209 245 L214 238"/>
    <path d="M228 264 L235 259"/><path d="M241 287 L249 284"/><path d="M252 316 H262"/>
    <path d="M241 345 L249 348"/><path d="M228 368 L235 373"/><path d="M209 387 L214 394"/>
    <path d="M188 399 L191 407"/><path d="M166 402 V412"/><path d="M144 399 L141 407"/>
    <path d="M123 387 L118 394"/><path d="M104 368 L97 373"/><path d="M91 345 L83 348"/>
    <path d="M80 316 H70"/><path d="M91 287 L83 284"/><path d="M104 264 L97 259"/>
    <path d="M123 245 L118 238"/><path d="M144 233 L141 225"/>
  </g>
  <g transform="translate(166 316)" stroke="#78947c" stroke-width="1" stroke-opacity=".72">
    <use href="#outerPetal" fill="#b99ac6" fill-opacity=".64" transform="rotate(0)"/>
    <use href="#outerPetal" fill="#c6afd0" fill-opacity=".65" transform="rotate(60)"/>
    <use href="#outerPetal" fill="#b99ac6" fill-opacity=".64" transform="rotate(120)"/>
    <use href="#outerPetal" fill="#c6afd0" fill-opacity=".65" transform="rotate(180)"/>
    <use href="#outerPetal" fill="#b99ac6" fill-opacity=".64" transform="rotate(240)"/>
    <use href="#outerPetal" fill="#c6afd0" fill-opacity=".65" transform="rotate(300)"/>
    <use href="#innerPetal" fill="#f3e9f0" fill-opacity=".97" transform="rotate(30)"/>
    <use href="#innerPetal" fill="#eaddec" fill-opacity=".97" transform="rotate(90)"/>
    <use href="#innerPetal" fill="#f3e9f0" fill-opacity=".97" transform="rotate(150)"/>
    <use href="#innerPetal" fill="#eaddec" fill-opacity=".97" transform="rotate(210)"/>
    <use href="#innerPetal" fill="#f3e9f0" fill-opacity=".97" transform="rotate(270)"/>
    <use href="#innerPetal" fill="#eaddec" fill-opacity=".97" transform="rotate(330)"/>
  </g>
  <g stroke="#d5aa70" stroke-width="1.4" stroke-linecap="round">
    <path d="M166 316 L166 301"/><path d="M166 316 L179 308"/><path d="M166 316 L179 324"/>
    <path d="M166 316 L166 331"/><path d="M166 316 L153 324"/><path d="M166 316 L153 308"/>
  </g>
  <g fill="#d5aa70"><circle cx="166" cy="300" r="2.2"/><circle cx="180" cy="307" r="2.2"/>
    <circle cx="180" cy="325" r="2.2"/><circle cx="166" cy="332" r="2.2"/>
    <circle cx="152" cy="325" r="2.2"/><circle cx="152" cy="307" r="2.2"/></g>
  <circle cx="166" cy="316" r="8" fill="#fffaf0" stroke="#d5aa70"/>
  <circle cx="166" cy="316" r="3" fill="#d5aa70"/>
  <text x="166" y="426" class="muted caps" font-size="8" font-weight="700" text-anchor="middle">SIGNAL BLOOM</text>

  <!-- Control heading -->
  <text x="342" y="111" fill="#6f9884" font-size="9" font-weight="700" letter-spacing="2">SPECTRAL GARDEN</text>
  <text x="342" y="132" class="muted" font-size="9.5">Shift the pitch field, then soften its edges.</text>

  <!-- Shift, centered at zero with semitone detents -->
  <g transform="translate(425 261)">
    <circle r="61" fill="#edf2eb" stroke="#cbd8c9" stroke-width="1"/>
    <path d="M-42.4 42.4 A60 60 0 1 1 42.4 42.4" fill="none" stroke="#cbd8c9" stroke-width="5" stroke-linecap="round"/>
    <path d="M-42.4 42.4 A60 60 0 0 1 0-60" fill="none" stroke="url(#dialArc)" stroke-width="5" stroke-linecap="round"/>
    <path d="M-46 46l-3 3 M-62 26l-4 2 M-67 0h5 M-62-26l-4-2 M-46-46l-3-3 M-26-62l-2-4 M0-67v-5 M26-62l2-4 M46-46l3-3 M62-26l4-2 M67 0h5 M62 26l4 2 M46 46l3 3" fill="none" stroke="#78947c" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round"/>
    <circle r="44" fill="#e4ece2" stroke="#78947c" stroke-opacity=".32"/>
    <path d="M0 0 V-35" stroke="#3d5944" stroke-width="2" stroke-linecap="round"/>
    <circle r="3" fill="#d5aa70"/>
  </g>
  <text x="425" y="190" class="deep caps" font-size="12" font-weight="700" text-anchor="middle">SHIFT</text>
  <text x="425" y="357" class="deep" font-size="16" font-weight="700" text-anchor="middle">0 st</text>
  <text x="425" y="380" class="muted caps" font-size="9" text-anchor="middle">SEMITONES · ±24</text>

  <!-- Mix -->
  <g transform="translate(602 261)">
    <circle r="61" fill="#edf2eb" stroke="#cbd8c9" stroke-width="1"/>
    <path d="M-42.4 42.4 A60 60 0 1 1 42.4 42.4" fill="none" stroke="#cbd8c9" stroke-width="5" stroke-linecap="round"/>
    <path d="M-42.4 42.4 A60 60 0 1 1 42.4 42.4" fill="none" stroke="url(#dialArc)" stroke-width="5" stroke-linecap="round"/>
    <path d="M-46 46l-3 3 M-62 26l-4 2 M-67 0h5 M-62-26l-4-2 M-46-46l-3-3 M-26-62l-2-4 M0-67v-5 M26-62l2-4 M46-46l3-3 M62-26l4-2 M67 0h5 M62 26l4 2 M46 46l3 3" fill="none" stroke="#78947c" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round"/>
    <circle r="44" fill="#e4ece2" stroke="#78947c" stroke-opacity=".32"/>
    <path d="M0 0 L25 25" stroke="#3d5944" stroke-width="2" stroke-linecap="round"/>
    <circle r="3" fill="#d5aa70"/>
  </g>
  <text x="602" y="190" class="deep caps" font-size="12" font-weight="700" text-anchor="middle">MIX</text>
  <text x="602" y="357" class="deep" font-size="16" font-weight="700" text-anchor="middle">100%</text>
  <text x="602" y="380" class="muted caps" font-size="9" text-anchor="middle">DRY / WET</text>

  <!-- Bloom -->
  <g transform="translate(779 261)">
    <circle r="61" fill="#edf2eb" stroke="#cbd8c9" stroke-width="1"/>
    <path d="M-42.4 42.4 A60 60 0 1 1 42.4 42.4" fill="none" stroke="#cbd8c9" stroke-width="5" stroke-linecap="round"/>
    <path d="M-42.4 42.4 A60 60 0 0 1 -20-56" fill="none" stroke="url(#dialArc)" stroke-width="5" stroke-linecap="round"/>
    <path d="M-46 46l-3 3 M-62 26l-4 2 M-67 0h5 M-62-26l-4-2 M-46-46l-3-3 M-26-62l-2-4 M0-67v-5 M26-62l2-4 M46-46l3-3 M62-26l4-2 M67 0h5 M62 26l4 2 M46 46l3 3" fill="none" stroke="#78947c" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round"/>
    <circle r="44" fill="#e4ece2" stroke="#78947c" stroke-opacity=".32"/>
    <path d="M0 0 L-35-2" stroke="#3d5944" stroke-width="2" stroke-linecap="round"/>
    <circle r="3" fill="#d5aa70"/>
  </g>
  <text x="779" y="190" class="deep caps" font-size="12" font-weight="700" text-anchor="middle">BLOOM</text>
  <text x="779" y="357" class="deep" font-size="16" font-weight="700" text-anchor="middle">18%</text>
  <text x="779" y="380" class="muted caps" font-size="9" text-anchor="middle">SPECTRAL SOFTNESS</text>

  <path d="M30 457 H890" stroke="#cbd8c9"/>
  <text x="36" y="483" class="muted caps" font-size="9">2048 FFT  ·  4× OVERLAP  ·  LATENCY COMPENSATED</text>
  <text x="888" y="483" class="leaf caps" font-size="9" text-anchor="end">FIELD SERIES / 01</text>
</svg>
