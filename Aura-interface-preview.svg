<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Aura by 355ERA — spectral grain shifter</title>
  <desc id="desc">A graphite and coral spectral effect interface with a functional grain and shift XY field, preset bank controls, and clearly labelled processing knobs.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#191b1d"/><stop offset="1" stop-color="#111315"/></linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbfaf6"/><stop offset="1" stop-color="#d9d9d3"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#f04f3b" stop-opacity=".27"/><stop offset="1" stop-color="#f04f3b" stop-opacity="0"/></radialGradient>
    <pattern id="grain" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r=".8" fill="#f4a093" opacity=".22"/><circle cx="13" cy="12" r=".65" fill="#f04f3b" opacity=".18"/></pattern>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .white { fill:#f2f1ed } .muted { fill:#919696 } .coral { fill:#f06a55 }
      .ink { fill:#25292a } .soft { fill:#646a69 }
    </style>
  </defs>
  <rect width="1040" height="620" fill="#0b0c0e"/>
  <rect x="8" y="8" width="1024" height="604" rx="18" fill="url(#shell)" stroke="#3c4143"/>
  <circle cx="40" cy="39" r="10" fill="#f04f3b"/>
  <circle cx="40" cy="39" r="3" fill="#f9c5bb"/>
  <text x="61" y="44" class="white" font-size="13" font-weight="700" letter-spacing="1.1">355ERA</text>
  <text x="159" y="43" class="muted" font-size="9" letter-spacing="1.1">AURA  /  SPECTRAL TEXTURE PROCESSOR</text>
  <path d="M28 62H1012" stroke="#3c4143"/>

  <text x="39" y="124" class="white" font-size="38" font-weight="700" letter-spacing="1.5">AURA</text>
  <text x="41" y="148" class="coral" font-size="10" font-weight="700" letter-spacing="1.6">SPECTRAL SHIFTER</text>
  <text x="41" y="168" class="muted" font-size="10">Shift · Scatter · Shape</text>
  <rect x="30" y="205" width="258" height="278" rx="13" fill="#151719" stroke="#3c4143"/>
  <text x="43" y="225" class="white" font-size="9" font-weight="700" letter-spacing=".6">GRAIN FIELD · SHIFT / GRAIN</text>
  <rect x="48" y="231" width="222" height="226" fill="url(#grain)"/>
  <path d="M103.5 231V457M159 231V457M214.5 231V457M48 287.5H270M48 344H270M48 400.5H270" stroke="#3c4143" stroke-width=".7" opacity=".52"/>
  <circle cx="159" cy="344" r="104" fill="url(#glow)"/>
  <g fill="none" stroke="#f4a093" stroke-width="1" opacity=".52">
