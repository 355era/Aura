    <text x="397" y="292">0.0 Hz</text><text x="557" y="292">100 %</text><text x="717" y="292">18 %</text><text x="877" y="292">22 %</text>
    <text x="477" y="455">120 ms</text><text x="637" y="455">12.0 gr/s</text><text x="797" y="455">18 %</text>
  </g>
  <g text-anchor="middle" class="muted" font-size="7.5" letter-spacing="1"><text x="397" y="309">FREQUENCY OFFSET</text><text x="557" y="309">DRY / WET</text><text x="717" y="309">SPECTRAL DENSITY</text><text x="877" y="309">GRANULAR LAYER</text><text x="477" y="472">WINDOW LENGTH</text><text x="637" y="472">GRAINS PER SEC</text><text x="797" y="472">GRAIN REPEATS</text></g>
  <path d="M30 566H1010" stroke="#343849"/>
  <text x="36" y="592" class="muted caps" font-size="8">2048 FFT · 4× OVERLAP · GRAIN FEEDBACK</text>
  <text x="1000" y="592" class="mint caps" font-size="8" text-anchor="end">355ERA / FIELD SERIES 01</text>
