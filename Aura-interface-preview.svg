  <circle cx="166" cy="316" r="8" fill="#f2f1ff" stroke="#ff997f"/><circle cx="166" cy="316" r="3" fill="#ff997f"/>
  <text x="166" y="434" class="muted caps" font-size="8" font-weight="700" text-anchor="middle">LIVE LEVEL</text>
